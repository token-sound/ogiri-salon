    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();

      // 封筒開封 (シャキーン)
      playOpen() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      // 送信完了 (和太鼓ドン)

        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
      // わっしょい！ (ピコーン拍手風)
      playYoisho() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      // カウントダウン警告音 (コツコツ)
      playTick(isDanger = false) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isDanger ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(isDanger ? 880 : 520, now);
        gain.gain.setValueAtTime(isDanger ? 0.25 : 0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

        this.init();

          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.35, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.5);
        });
      }

        return saved ? JSON.parse(saved) : INITIAL_ANSWERS;
      });

      // 1ヶ月後の正体アンヴェイル（正体明かし）モードフラグ
      const [isUnveiled, setIsUnveiled] = useState(() => {
        return localStorage.getItem('ogiri_salon_unveiled') === 'true';
      });

      // ベスト3宣伝枠データ
      const [top3Promos, setTop3Promos] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_promos');
        return saved ? JSON.parse(saved) : INITIAL_TOP3_PROMOS;
      });

      // 宣伝編集モーダル
      const [editingRank, setEditingRank] = useState(null);
      const [editPromoForm, setEditPromoForm] = useState({ title: '', hobby: '', intro: '', link: '' });

      // 設定・プロフィール変更モーダル
      const [showProfileModal, setShowProfileModal] = useState(false);

      // サロン遊び方ルールブックモーダル
      const [showGuideModal, setShowGuideModal] = useState(false);

      // PWAインストール案内モーダル
      const [showInstallModal, setShowInstallModal] = useState(false);
      const [installPrompt, setInstallPrompt] = useState(null);

      // 月間カレンダー展開フラグ (A+D融合)
      const [showCalendar, setShowCalendar] = useState(false);

      // テスト・動作確認用の日付シミュレーター (1..30)
      const [simulatedDay, setSimulatedDay] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_sim_day');
        return saved ? parseInt(saved, 10) : new Date().getDate();
      });

      // 日付シミュレーター変更
      const changeSimDay = (newDay) => {
        const d = Math.max(1, Math.min(30, newDay));
        setSimulatedDay(d);
        localStorage.setItem('ogiri_salon_sim_day', d.toString());
      };

      // カレンダー日程計算（シミュレーター連動）
      const calendarInfo = useMemo(() => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const totalDays = new Date(year, month, 0).getDate();
        const today = Math.min(totalDays, simulatedDay);
        const daysLeft = Math.max(0, totalDays - today);
        const progressPercent = Math.min(100, Math.round((today / totalDays) * 100));

        const days = [];
        for (let d = 1; d <= totalDays; d++) {
          let status = 'future';
          if (d < today) status = 'past';
          else if (d === today) status = 'today';
          days.push({ day: d, status, isFinal: d === totalDays });
        }

        return { year, month, today, totalDays, daysLeft, progressPercent, days };
      }, [simulatedDay]);

      // PWA インストールプロンプト監視
      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const handleInstallClick = () => {
        if (installPrompt) {
          installPrompt.prompt();
          installPrompt.userChoice.then(() => {
            setInstallPrompt(null);
          });
        } else {
          setShowInstallModal(true);
        }
      };

      // タイマー用Ref
      const timerRef = useRef(null);

      // 初回未登録ならプロフィール設定を開く & データクリーンアップ
      const DATA_VERSION = 'v4_15members_clean';
      useEffect(() => {
        const currentVer = localStorage.getItem('ogiri_salon_version');
        if (currentVer !== DATA_VERSION) {
          localStorage.removeItem('ogiri_salon_answers');
          localStorage.removeItem('ogiri_salon_answered');
          localStorage.removeItem('ogiri_salon_letters');
          localStorage.setItem('ogiri_salon_version', DATA_VERSION);
          setAnswers(INITIAL_ANSWERS);
          setAnsweredIndices([]);
        }
        if (!profile.isRegistered) {
          setShowProfileModal(true);
        }
      }, []);

      // デモデータのリセット（主さん確認用）
      const handleResetDemo = () => {
        if (confirm('デモデータを初期状態にリセットしますか？\n（過去の投稿やワッショイ履歴が初期化され、最初からテストできます）')) {
          localStorage.clear();
          location.reload();
        }
      };

      // Lucide アイコン初期化
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // タイマー処理 (110秒カウントダウン)
      useEffect(() => {
        if (openedIndex !== null && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleTimeUp();
                return 0;
              }
              // カウントダウン警告音（残り30秒以下で5秒ごと、残り10秒以下で毎秒）
              if (prev <= 10) {
                sound.playTick(true);
              } else if (prev <= 30 && prev % 5 === 0) {
                sound.playTick(false);
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [openedIndex, timeLeft]);

      // 封筒を開封するアクション
      const handleOpenEnvelope = (index) => {
        if (answeredIndices.includes(index)) return; // 既に回答済み
        if (openedIndex !== null) return; // 既に他の問題を開いている

        sound.playOpen();
        setOpenedIndex(index);
        setTimeLeft(TIME_LIMIT);
        setCurrentInput('');
      };

      // 回答を送信する
      const handleSubmitAnswer = () => {
        if (openedIndex === null) return;
        const text = currentInput.trim();
        if (!text) {
          alert('ボケを入力してください！');
          return;
        }

        sound.playSubmit();
        const currentTopic = TODAY_TOPICS[openedIndex];

        // 新しい回答を作成
        const newAnswer = {
          id: 'ans_' + Date.now(),
          topicId: currentTopic.id,
          fakeName: profile.fakeName || '覆面の刺客',
          avatar: profile.avatar || '🦊',
          realName: profile.realName || 'サロンの仲間',
          text: text,
          points: 1, // 自分自身からの初期1P
          voters: ['user_self']
        };

        const updatedAnswers = [newAnswer, ...answers];
        setAnswers(updatedAnswers);
        localStorage.setItem('ogiri_salon_answers', JSON.stringify(updatedAnswers));

        // 回答済みインデックスを更新
        const newAnswered = [...answeredIndices, openedIndex];
        setAnsweredIndices(newAnswered);
        localStorage.setItem('ogiri_salon_answered', JSON.stringify(newAnswered));

        // 紙吹雪
        if (window.confetti) {
          window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        // 🤖 他のAI仲間たちからリアルタイムにワッショイが届くライブ演出！
        const aiFans = [
          { name: 'ヒロシ@珈琲屋', avatar: '🐼' },
          { name: 'ユウキ@Web制作', avatar: '🦉' },
          { name: 'さくらんぼ', avatar: '🦝' },
          { name: 'マスターT', avatar: '👺' },
          { name: 'のんちゃん', avatar: '🐱' }
        ];
        [1500, 3200, 5200].forEach((delay, i) => {
          const fan = aiFans[i % aiFans.length];
          setTimeout(() => {
            sound.playYoisho();
            if (window.confetti) {
              window.confetti({ particleCount: 25, spread: 45, origin: { y: 0.7 } });
            }
            setAnswers(prev => prev.map(a => {
              if (a.id === newAnswer.id) {
                return {
                  ...a,
                  points: a.points + 1,
                  voters: [...a.voters, `fan_${i}`]
                };
              }
              return a;
            }));
            setToastNotification({
              icon: '👏',
              text: `${fan.avatar} ${fan.name} から「わっしょい！」が届きました！(+1P)`
            });
            setTimeout(() => setToastNotification(null), 2500);
          }, delay);
        });

        // 開封状態を終了
        setOpenedIndex(null);
        setCurrentInput('');
      };

      // 時間切れ時の自動提出処理
      const handleTimeUp = () => {
        sound.playTick(true);
        if (currentInput.trim()) {
          handleSubmitAnswer();
        } else {
          alert('⏰ 1分50秒が経過しました！残念ながらタイムアップ（パス）です。次の問題に挑戦しましょう！');
          if (openedIndex !== null) {
            const newAnswered = [...answeredIndices, openedIndex];
            setAnsweredIndices(newAnswered);
            localStorage.setItem('ogiri_salon_answered', JSON.stringify(newAnswered));
            setOpenedIndex(null);
            setCurrentInput('');
          }
        }
      };

      // わっしょい！投票処理
      const handleYoisho = (answerId) => {
        sound.playYoisho();
        if (window.confetti) {
          window.confetti({ particleCount: 30, spread: 45, origin: { y: 0.7 } });
        }

        const updated = answers.map(a => {
          if (a.id === answerId) {
            const hasVoted = a.voters.includes('user_self');
            return {
              ...a,
              points: hasVoted ? a.points : a.points + 1,
              voters: hasVoted ? a.voters : [...a.voters, 'user_self']
            };
          }
          return a;
        });
        setAnswers(updated);
        localStorage.setItem('ogiri_salon_answers', JSON.stringify(updated));
      };

      // 正体アンヴェイル切り替え
      const toggleUnveil = () => {
        const next = !isUnveiled;
        setIsUnveiled(next);
        localStorage.setItem('ogiri_salon_unveiled', next.toString());
        if (next) {
          sound.playReveal();
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
          }
          // 主宛てに仲間から新しい称賛レターが届く演出！
          setTimeout(() => {
            const letterFromSakuranbo = {
              id: 'let_sakura_' + Date.now(),
              fromReal: 'さくらんぼ',
              fromFake: '仮面タヌキ',
              avatar: '🦝',
              text: '主さん！1ヶ月間大喜利めちゃくちゃ楽しかったです！主さんのボケで一番笑いましたw 次回もぜひやってください！',
              date: 'たった今'
            };
            setLetters(prev => [letterFromSakuranbo, ...prev]);
            setToastNotification({
              icon: '📬',
              text: 'さくらんぼさんからあなた宛てに称賛レターが届きました！'
            });
            setTimeout(() => setToastNotification(null), 3500);
          }, 1200);
        }
      };

      // プロフィール保存
      const saveProfile = (newProfile) => {
        const p = { ...newProfile, isRegistered: true };
        setProfile(p);
        localStorage.setItem('ogiri_salon_profile', JSON.stringify(p));
        setShowProfileModal(false);
      };

      // 宣伝枠の編集保存
      const savePromo = () => {
        if (!editingRank) return;
        const updated = {
          ...top3Promos,
          [editingRank]: { ...editPromoForm }
        };
        setTop3Promos(updated);
        localStorage.setItem('ogiri_salon_promos', JSON.stringify(updated));
        setEditingRank(null);
      };

      // 称賛レター送信処理
      const handleSendLetter = () => {
        if (!sendingTarget || !letterInput.trim()) return;
        sound.playSubmit();
        if (window.confetti) {
          window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        }
        const targetName = sendingTarget.realName;
        alert(`💌 ${targetName} さんへ称賛メッセージを届けました！`);
        
        // デモ用：相手からお礼の返信が届く温かい演出！
        const newReply = {
          id: 'let_' + Date.now(),
          fromReal: targetName,
          fromFake: sendingTarget.fakeName,
          avatar: sendingTarget.avatar,
          text: `メッセージありがとうございます！「${letterInput.trim()}」と褒めてもらえてめちゃくちゃ嬉しいです！これからもよろしくお願いします！`,
          date: 'たった今'
        };
        const updatedLetters = [newReply, ...letters];
        setLetters(updatedLetters);
        localStorage.setItem('ogiri_salon_letters', JSON.stringify(updatedLetters));

        setSendingTarget(null);
        setLetterInput('');
      };

      // 自分が今月ワッショイした仲間たち一覧
      const yoishoedList = useMemo(() => {
        const map = {};
        answers.forEach(a => {
          if (a.voters && a.voters.includes('user_self') && a.realName !== profile.realName) {
            if (!map[a.realName]) {
              // 15名中、タカシさんとリエさんのみ「交流お休み中」テスト、他13名は「称賛受付中」
              const isQuiet = a.realName.includes('タカシ') || a.realName.includes('リエ');
              map[a.realName] = {
                realName: a.realName,
                fakeName: a.fakeName,
                avatar: a.avatar,
                acceptMessages: !isQuiet,
                answers: []
              };
            }
            map[a.realName].answers.push(a.text);
          }
        });
        return Object.values(map);
      }, [answers, profile.realName]);

      // ランキング集計（サロン本名または仮名単位）
      const rankingList = useMemo(() => {
        const scoreMap = {};
        answers.forEach(a => {
          const key = a.realName;
          if (!scoreMap[key]) {
            scoreMap[key] = {
              realName: a.realName,
              fakeName: a.fakeName,
              avatar: a.avatar,
              totalPoints: 0,
              bestAnswer: a.text,
              count: 0
            };
          }
          scoreMap[key].totalPoints += a.points;
          scoreMap[key].count += 1;
        });
        return Object.values(scoreMap).sort((a, b) => b.totalPoints - a.totalPoints);
      }, [answers]);

      // タイマー色計算
      const timerColor = timeLeft > 40 ? 'bg-emerald-500' : timeLeft > 15 ? 'bg-amber-500' : 'bg-rose-500 animate-pulse';

      return (
        <div className="flex-1 flex flex-col py-4 w-full relative">
          {/* 🔔 ライブトースト通知 */}
          {toastNotification && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-amber-400/80 text-amber-300 px-4 py-2 rounded-full shadow-2xl flex items-center gap-2 text-xs font-bold animate-bounce">
              <span className="text-base">{toastNotification.icon}</span>
              <span>{toastNotification.text}</span>
            </div>
          )}

          {/* ヘッダー */}
          <header className="flex items-center justify-between py-3 border-b border-slate-800 mb-4">
            {/* ロゴ・タイトル（未開封ならクリックで名前修正、回答後はトップ復帰） */}
            <div
              onClick={() => {
                setTab('today');
                if (answeredIndices.length === 0 && openedIndex === null) {
                  setShowProfileModal(true);
                }
              }}
              className="flex items-center gap-2 cursor-pointer hover:opacity-90 transition group select-none"
              title={answeredIndices.length === 0 && openedIndex === null ? "クリックで名前やプロフィールを修正できます" : "トップページ（今日の5問）に戻る"}
            >
              <span className="text-2xl group-hover:scale-110 transition-transform">🎭</span>
              <div>
                <h1 className="text-lg font-bold font-pop text-amber-400 tracking-wide flex items-center gap-1.5">
                  サロン大喜利
                  <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">仲間内編</span>
                </h1>
                {answeredIndices.length === 0 && openedIndex === null ? (
                  <p className="text-[11px] text-amber-300/90 group-hover:text-amber-200 transition flex items-center gap-1">
                    <span>✏️</span> 未開封ならクリックで名前修正OK！
                  </p>
                ) : (
                  <p className="text-xs text-slate-400 group-hover:text-slate-300 transition">仮名でボケて1ヶ月後に正体明かし！</p>
                )}
              </div>
            </div>

            {/* ヘッダー右側ボタン群 */}
            <div className="flex items-center gap-1.5">
              {/* 届いたレターボタン */}
              <button
                onClick={() => setShowInboxModal(true)}
                className="relative flex items-center gap-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-300 px-2.5 py-1.5 rounded-full text-xs font-bold transition shadow-sm"
                title="仲間から届いた称賛レターを見る"
              >
                <span>📬</span>
                <span className="hidden sm:inline">レター</span>
                {letters.length > 0 && (
                  <span className="bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                    {letters.length}
                  </span>
                )}
              </button>

              {/* アプリ追加ボタン */}
              <button
                onClick={handleInstallClick}
                className="flex items-center gap-1 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 px-2 py-1.5 rounded-full text-xs font-bold transition shadow-sm"
                title="スマホにアプリとして追加する"
              >
                <span>📲</span>
                <span className="hidden sm:inline">アプリ化</span>
              </button>

              {/* ルールブックボタン */}
              <button
                onClick={() => setShowGuideModal(true)}
                className="flex items-center gap-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-300 px-2 py-1.5 rounded-full text-xs font-bold transition shadow-sm"
                title="遊び方・ルールを見る"
              >
                <span>❓</span>
                <span className="hidden sm:inline">遊び方</span>
              </button>

              {/* プロフィールボタン */}
              <button
                onClick={() => setShowProfileModal(true)}
                className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full text-xs transition"
              >
                <span className="text-base">{profile.avatar}</span>
                <div className="text-left">
                  <p className="font-bold text-amber-300 leading-none">{profile.fakeName}</p>
                  <p className="text-[10px] text-slate-400 leading-none mt-1">本名: {profile.realName}</p>
                </div>
              </button>
            </div>
          </header>

          {/* ================= A+D融合：月間カウントダウン＆開閉カレンダー ================= */}
          <section className="mb-4 space-y-2">
            {/* 日めくり付き進行バナー（クリックで開閉） */}
            <button
              onClick={() => setShowCalendar(!showCalendar)}
              className="w-full bg-gradient-to-r from-slate-900 via-indigo-950/60 to-slate-900 border border-amber-500/40 hover:border-amber-400 rounded-2xl p-3 text-left transition shadow-lg flex items-center justify-between gap-3 active:scale-[0.99]"
            >
              <div className="space-y-1.5 flex-1 min-w-0">
                <div className="flex items-center gap-1.5 text-xs font-bold flex-wrap">
                  <span className="text-base">📅</span>
                  <span className="text-white">{calendarInfo.month}月シーズン</span>
                  <span className="text-amber-400 font-mono text-[11px] bg-slate-950/70 px-2 py-0.5 rounded-full border border-slate-700">
                    DAY {calendarInfo.today} / {calendarInfo.totalDays}
                  </span>
                </div>
                {/* 進行プログレスゲージ */}
                <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden p-0.5">
                  <div
                    className="bg-gradient-to-r from-indigo-500 via-amber-500 to-amber-400 h-full rounded-full transition-all duration-500"
                    style={{ width: `${calendarInfo.progressPercent}%` }}
                  ></div>
                </div>
                <div className="flex items-center justify-between text-[10px] text-slate-400">
                  <span>{calendarInfo.progressPercent}% 進行中</span>
                  <span className="text-amber-300 font-bold flex items-center gap-0.5">
                    {showCalendar ? 'カレンダーを閉じる ▲' : '30日カレンダーを見る ▼'}
                  </span>
                </div>
              </div>

              {/* Dの特長：日めくり風カウントダウンバッジ */}
              <div className="bg-slate-950 border-2 border-amber-500/70 rounded-xl px-3 py-1.5 text-center shadow-md shrink-0">
                <span className="text-[9px] text-amber-400 font-bold block uppercase border-b border-slate-800 pb-0.5 tracking-wider">正体明かしまで</span>
                <div className="font-mono font-black text-2xl text-amber-400 leading-none my-0.5">
                  {calendarInfo.daysLeft}
                </div>
                <span className="text-[9px] text-slate-400 block font-bold">DAYS LEFT</span>
              </div>
            </button>

            {/* Aの特長：展開される30日カレンダー（終わった日＝グレー、今日＝オレンジ） */}
            {showCalendar && (
              <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-xl animate-fadeIn">
                <div className="flex items-center justify-between text-[11px] text-slate-400 px-1 border-b border-slate-800 pb-2">
                  <span className="font-bold text-slate-200">
                    {calendarInfo.year}年 {calendarInfo.month}月カレンダー
                  </span>
                  <div className="flex items-center gap-2.5 text-[10px]">
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full bg-slate-700"></span> 終了
                    </span>
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full bg-amber-500"></span> 今日
                    </span>
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 rounded-full border border-slate-600"></span> これから
                    </span>
                  </div>
                </div>

                {/* 🧪 テスト・動作確認用 日付早送りコントローラー */}
                <div className="bg-slate-950/80 border border-indigo-500/30 rounded-xl p-2.5 space-y-2">
                  <div className="flex items-center justify-between text-[11px]">
                    <span className="text-indigo-300 font-bold flex items-center gap-1">
                      <span>🧪</span>
                      <span>テスト用・日付早送り操作</span>
                    </span>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] text-slate-400 font-mono">
                        現在: <b className="text-amber-400">{calendarInfo.today}日目</b> (残り{calendarInfo.daysLeft}日)
                      </span>
                      <button
                        type="button"
                        onClick={handleResetDemo}
                        className="text-[10px] text-rose-400 hover:text-rose-300 underline"
                        title="デモデータを初期状態にリセット"
                      >
                        🧹データ初期化
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-4 gap-1.5 text-xs font-bold">
                    <button
                      type="button"
                      onClick={() => changeSimDay(calendarInfo.today - 1)}
                      disabled={calendarInfo.today <= 1}
                      className="py-1.5 px-1 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 border border-slate-700 text-center transition"
                    >
                      ◀ 1日前
                    </button>
                    <button
                      type="button"

                  </div>

                  {/* ルール2 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-indigo-500 text-white font-bold flex items-center justify-center text-xs">2</span>
                      <h5 className="font-bold text-slate-100 text-xs">1日5問・1問1分50秒のライブ勝負！</h5>
                    </div>
                    <p className="text-slate-400 pl-8 text-[11px]">
                      お題は最初は封筒（💌）で隠されています。開封した瞬間にタイマーがスタート！ネット検索やAIに頼る暇のない「110秒の直感勝負」だからこそ、全員が平等に楽しめます。
                    </p>
                  </div>

                  {/* ルール3 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-xs">3</span>
                      <h5 className="font-bold text-slate-100 text-xs">仲間のボケに「わっしょい！👏」と投票</h5>
                    </div>
                    <p className="text-slate-400 pl-8 text-[11px]">
                      「みんなのボケ」タブで仲間の回答を見ることができます。クスッと笑えたボケにはどんどん「わっしょい！」を押してポイントをプレゼントしましょう！
                    </p>
                  </div>

                  {/* ルール4 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-purple-500 text-white font-bold flex items-center justify-center text-xs">4</span>
                      <h5 className="font-bold text-slate-100 text-xs">1ヶ月後に正体一斉アンヴェイル（開示）！</h5>
                    </div>
                    <p className="text-slate-400 pl-8 text-[11px]">
                      1ヶ月間、誰のボケか分からない状態でポイントを蓄積。月末に全員のサロン本名が一斉開示されます！「えっ！あのキレキレのボケ〇〇さんだったの！？」と最高のネタバラシが待っています。
                    </p>
                  </div>

                  {/* ルール5 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center text-xs">5</span>
                      <h5 className="font-bold text-slate-100 text-xs">👑 ベスト3には「好きなこと宣伝枠」！</h5>
                    </div>
                    <p className="text-slate-400 pl-8 text-[11px]">
                      月間ポイント上位3名には、アプリTOPの特設ステージで「自分の好きなこと・自己紹介・活動リンク（SNSや自作作品など）」を堂々とPRできる権利が贈呈されます！
                    </p>
                  </div>

                  {/* ルール6：個人情報ゼロ設計 */}
                  <div className="bg-emerald-950/40 border border-emerald-500/30 rounded-2xl p-3.5 space-y-1.5">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-full bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-xs">🔒</span>
                      <h5 className="font-bold text-emerald-300 text-xs">個人情報を一切預けない安心設計！</h5>
                    </div>
                    <p className="text-slate-300 pl-8 text-[11px] leading-relaxed">
                      メールアドレス、パスワード、電話番号などの個人情報は一切登録不要です。回答やポイントはお手元のスマホ/ブラウザ内にのみ保存されるため、外部への情報流出リスクが物理的にゼロ。どなたでも安心してお気軽にご参加いただけます。
                    </p>
                  </div>
                </div>

                {/* モーダルフッター */}
                <div className="pt-3 border-t border-slate-800">
                  <button
                    onClick={() => setShowGuideModal(false)}
                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-lg hover:brightness-110 active:scale-95"
                  >
                    ルールを理解した！大喜利へGO！
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：スマホにアプリ追加（PWAガイド） ================= */}
          {showInstallModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-indigo-500/40 rounded-3xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📲</span>
                    <div>
                      <h3 className="font-bold text-indigo-300 font-pop text-base">スマホにアプリを追加</h3>
                      <p className="text-[11px] text-slate-400">ホーム画面に置いてワンタップで起動！</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4 py-4 text-xs text-slate-300 leading-relaxed">
                  {/* アプリ化のメリット */}
                  <div className="bg-indigo-500/10 border border-indigo-500/30 rounded-2xl p-3 text-indigo-200">
                    <p className="text-[11px]">
                      ホーム画面に追加すると、ブラウザのURLバーが消えて<b>本物のアプリのように全画面でサクサク遊べます！</b>
                    </p>
                  </div>

                  {/* iPhone (Safari) の手順 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🍎</span>
                      <h5 className="font-bold text-slate-100 text-xs">iPhone / iPad (Safari) の場合</h5>
                    </div>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-400 text-[11px]">
                      <li>画面下部の <span className="text-indigo-400 font-bold">「共有ボタン（四角から上矢印 ⎋）」</span> をタップ</li>
                      <li>メニューを少し下にスクロール</li>
                      <li><span className="text-amber-300 font-bold">「ホーム画面に追加（＋）」</span> をタップ</li>
                      <li>右上の「追加」を押せば完了！</li>
                    </ol>
                  </div>

                  {/* Android (Chrome) の手順 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🤖</span>
                      <h5 className="font-bold text-slate-100 text-xs">Android (Chrome) の場合</h5>
                    </div>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-400 text-[11px]">
                      <li>画面右上の <span className="text-indigo-400 font-bold">「︙（メニュー）」</span> をタップ</li>
                      <li><span className="text-amber-300 font-bold">「アプリをインストール」</span> または <span className="text-amber-300 font-bold">「ホーム画面に追加」</span> をタップ</li>
                      <li>確認画面で「インストール」を押せば完了！</li>
                    </ol>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：届いた称賛レターBOX ================= */}
          {showInboxModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 w-full max-w-md max-h-[85vh] overflow-y-auto shadow-2xl flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📬</span>
                    <div>
                      <h3 className="font-bold text-amber-300 font-pop text-base">仲間からの称賛レター</h3>
                      <p className="text-[11px] text-slate-400">あなたのボケで笑った仲間からの温かい感想</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowInboxModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 py-4 flex-1">
                  {letters.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 space-y-2">
                      <span className="text-3xl block">💌</span>
                      <p className="text-xs">まだ届いたレターはありません</p>
                      <p className="text-[11px] text-slate-600">あなたのボケにワッショイしてくれた仲間からメッセージが届きます！</p>
                    </div>
                  ) : (
                    letters.map(letItem => (
                      <div
                        key={letItem.id}
                        className="bg-slate-950/80 border border-amber-500/30 rounded-2xl p-3.5 space-y-2 shadow-sm"
                      >
                        <div className="flex items-center justify-between text-xs pb-1.5 border-b border-slate-800/80">
                          <div className="flex items-center gap-2">
                            <span className="text-xl">{letItem.avatar}</span>
                            <div>
                              <span className="font-bold text-slate-200">{letItem.fromReal}</span>
                              <span className="text-[10px] text-slate-400 ml-1">({letItem.fromFake})</span>
                            </div>
                          </div>
                          <span className="text-[10px] text-slate-500 font-mono">{letItem.date}</span>
                        </div>
                        <p className="text-xs text-slate-300 font-kiwi leading-relaxed pl-1">
                          {letItem.text}
                        </p>
                      </div>
                    ))
                  )}
                </div>

                <div className="pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowInboxModal(false)}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-md"
                  >
                    レターBOXを閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：称賛メッセージ送信 ================= */}
          {sendingTarget && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-indigo-500/50 rounded-3xl p-5 w-full max-w-md shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">💌</span>
                    <div>
                      <h3 className="font-bold text-indigo-300 font-pop text-sm">称賛メッセージを送る</h3>
                      <p className="text-[11px] text-slate-400">面白かった感謝とリスペクトを届けよう！</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setSendingTarget(null)}
                    className="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* 宛先プレビュー */}
                <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">{sendingTarget.avatar}</span>
                    <span className="font-bold text-slate-200">{sendingTarget.realName} さんへ</span>
                    <span className="text-[10px] text-slate-400">({sendingTarget.fakeName})</span>
                  </div>
                  <p className="text-[11px] text-slate-400 pl-7 truncate">
                    笑ったボケ: 「{sendingTarget.answers[0]}」
                  </p>
                </div>

                {/* かんたん定型文チップ */}
                <div className="space-y-1">
                  <span className="text-[10px] text-slate-400 block">タップで一言挿入：</span>
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      'あのボケ最高でした！笑',
                      'センス神すぎて脱帽ですw',
                      '今度サロンで語りましょう！',
                      '次回も楽しみにしています！'
                    ].map(chip => (
                      <button
                        key={chip}
                        type="button"
                        onClick={() => setLetterInput(prev => (prev ? prev + ' ' : '') + chip)}
                        className="text-[10px] bg-indigo-950/60 hover:bg-indigo-900 border border-indigo-500/40 text-indigo-200 px-2.5 py-1 rounded-full transition"
                      >
                        {chip}
                      </button>
                    ))}
                  </div>
                </div>

                {/* メッセージ入力欄 */}
                <div>
                  <textarea
                    rows={3}
                    value={letterInput}
                    onChange={(e) => setLetterInput(e.target.value)}
                    placeholder="温かい感想やメッセージを入力してください..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-indigo-400 transition resize-none"
                    autoFocus
                  ></textarea>
                </div>

                <div className="flex items-center gap-2 pt-1">
                  <button
                    onClick={() => setSendingTarget(null)}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSendLetter}
                    disabled={!letterInput.trim()}
                    className={`flex-1 font-bold py-2 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5 ${
                      letterInput.trim()
                        ? 'bg-gradient-to-r from-indigo-500 to-purple-600 hover:brightness-110 active:scale-95 text-white'
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }`}
                  >
                    <span>💌</span>
                    <span>メッセージを届ける！</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
