    /* 3Dカード反転アニメーション（正体アンヴェイル用） */

    // --- セキュリティガード：ソース盗用防止（右クリック・F12ガード） ---
    (function preventSourceTheft() {
      document.addEventListener('contextmenu', e => e.preventDefault());

        if (

        }
      });

    const { useState, useEffect, useRef, useMemo } = React;

    // --- 効果音システム (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      // 封筒開封 (シャキーン)
      playOpen() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      // 送信完了 (和太鼓ドン)
      playSubmit() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
      // わっしょい！ (ピコーン拍手風)
      playYoisho() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      // カウントダウン警告音 (コツコツ)
      playTick(isDanger = false) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isDanger ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(isDanger ? 880 : 520, now);
        gain.gain.setValueAtTime(isDanger ? 0.25 : 0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
      // 正体発表ドラムロール＆ファンファーレ
      playReveal() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.35, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.5);
        });
      }
    }

                    </div>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-400 text-[11px]">
                      <li>画面下部の <span className="text-indigo-400 font-bold">「共有ボタン（四角から上矢印 ⎋）」</span> をタップ</li>
                      <li>メニューを少し下にスクロール</li>
                      <li><span className="text-amber-300 font-bold">「ホーム画面に追加（＋）」</span> をタップ</li>
                      <li>右上の「追加」を押せば完了！</li>
                    </ol>
                  </div>

                  {/* Android (Chrome) の手順 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🤖</span>
                      <h5 className="font-bold text-slate-100 text-xs">Android (Chrome) の場合</h5>
                    </div>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-400 text-[11px]">
                      <li>画面右上の <span className="text-indigo-400 font-bold">「︙（メニュー）」</span> をタップ</li>
                      <li><span className="text-amber-300 font-bold">「アプリをインストール」</span> または <span className="text-amber-300 font-bold">「ホーム画面に追加」</span> をタップ</li>
                      <li>確認画面で「インストール」を押せば完了！</li>
                    </ol>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：届いたわっしょいレターBOX ================= */}
          {showInboxModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 w-full max-w-md max-h-[85vh] overflow-y-auto shadow-2xl flex flex-col">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📬</span>
                    <div>
                      <h3 className="font-bold text-amber-300 font-pop text-base">仲間からのわっしょいレター</h3>
                      <p className="text-[11px] text-slate-400">あなたのボケで笑った仲間からの温かい感想</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowInboxModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 py-4 flex-1">
                  {letters.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 space-y-2">
                      <span className="text-3xl block">💌</span>
                      <p className="text-xs">まだ届いたレターはありません</p>
                      <p className="text-[11px] text-slate-600">あなたのボケにワッショイしてくれた仲間からメッセージが届きます！</p>
                    </div>
                  ) : (
                    letters.map(letItem => (
                      <div
                        key={letItem.id}
                        className="bg-slate-950/80 border border-amber-500/30 rounded-2xl p-3.5 space-y-2.5 shadow-sm"
                      >
                        <div className="flex items-center justify-between text-xs pb-1.5 border-b border-slate-800/80">
                          <div className="flex items-center gap-2">
                            <span className="text-xl">{letItem.avatar}</span>
                            <div>
                              <span className="font-bold text-slate-200">{letItem.fromReal}</span>
                              <span className="text-[10px] text-slate-400 ml-1">({letItem.fromFake})</span>
                            </div>
                          </div>
                          <span className="text-[10px] text-slate-500 font-mono">{letItem.date}</span>
                        </div>
                        <p className="text-xs text-slate-300 font-kiwi leading-relaxed pl-1">
                          {letItem.text}
                        </p>

                        {/* 御礼返信エリア（1回のみ・1往復完結） */}
                        {letItem.isReply ? (
                          <div className="pt-1.5 border-t border-slate-900 text-[10px] text-amber-400/90 flex items-center gap-1 font-medium">
                            <span>✨ 相手から届いた御礼レターです（1往復完結）</span>
                          </div>
                        ) : (
                          <div className="pt-2 border-t border-slate-900 flex justify-end">
                            {letItem.hasReplied ? (
                              <span className="text-[10px] bg-slate-800/80 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">
                                ✅ 御礼返信済み
                              </span>
                            ) : (
                              <button
                                type="button"
                                onClick={() => {
                                  setReplyingLetter(letItem);
                                  setSelectedReplyTemplate(null);
                                }}
                                className="bg-gradient-to-r from-amber-500 to-amber-600 hover:brightness-110 active:scale-95 text-slate-950 font-bold text-[11px] px-3 py-1 rounded-full shadow transition flex items-center gap-1"
                              >
                                <span>💌</span>
                                <span>御礼を返す（1回のみ）</span>
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>

                <div className="pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowInboxModal(false)}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-md"
                  >
                    レターBOXを閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：わっしょいレター送信（定型5種・フリー記述ゼロ） ================= */}
          {sendingTarget && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-indigo-500/50 rounded-3xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">💌</span>
                    <div>
                      <h3 className="font-bold text-indigo-300 font-pop text-sm flex items-center gap-1.5">
                        わっしょいレターを送る
                        <span className="text-[10px] font-normal bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">
                          {periodLabel}
                        </span>
                      </h3>
                      <p className="text-[11px] text-slate-400">面白かった感謝とリスペクトを届けよう！（文章入力不要）</p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setSendingTarget(null);
                      setSelectedPraiseTemplate(null);
                    }}
                    className="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* 宛先プレビュー */}
                <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">{sendingTarget.avatar}</span>
                    <span className="font-bold text-slate-200">{sendingTarget.realName} さんへ</span>
                    <span className="text-[10px] text-slate-400">({sendingTarget.fakeName})</span>
                  </div>
                  <p className="text-[11px] text-slate-400 pl-7 truncate">
                    笑ったボケ: 「{sendingTarget.answers[0]}」
                  </p>
                </div>

                {/* 定型文5種選択リスト（うち1つちょいとがり玄人） */}
                <div className="space-y-2">
                  <span className="text-[11px] text-slate-300 font-bold block">
                    メッセージを1つ選んでください（10日ごとに自動更新）：
                  </span>
                  <div className="space-y-1.5">
                    {currentPraiseTemplates.map(tmpl => {
                      const isSelected = selectedPraiseTemplate?.id === tmpl.id;
                      return (
                        <button
                          key={tmpl.id}
                          type="button"
                          onClick={() => setSelectedPraiseTemplate(tmpl)}
                          className={`w-full text-left p-3 rounded-2xl border transition text-xs flex items-center justify-between ${
                            isSelected
                              ? 'bg-indigo-600/30 border-indigo-400 text-white shadow-md'
                              : 'bg-slate-950/80 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex-1 pr-2">
                            {tmpl.isExpert && (
                              <span className="inline-block bg-purple-500/20 text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-purple-500/30 mb-1">
                                😈 ちょいとがり玄人
                              </span>
                            )}
                            <p className="font-kiwi leading-relaxed">{tmpl.text}</p>
                          </div>
                          <span className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                            isSelected ? 'border-indigo-400 bg-indigo-500 text-white text-[10px] font-bold' : 'border-slate-600'
                          }`}>
                            {isSelected ? '✓' : ''}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="flex items-center gap-2 pt-1">
                  <button
                    onClick={() => {
                      setSendingTarget(null);
                      setSelectedPraiseTemplate(null);
                    }}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSendLetter}
                    disabled={!selectedPraiseTemplate}
                    className={`flex-1 font-bold py-2 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5 ${
                      selectedPraiseTemplate
                        ? 'bg-gradient-to-r from-indigo-500 to-purple-600 hover:brightness-110 active:scale-95 text-white'
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }`}
                  >
                    <span>💌</span>
                    <span>この定型文で届ける！</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= モーダル：御礼返信（1回のみ・定型5種） ================= */}
          {replyingLetter && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/50 rounded-3xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl space-y-3.5">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">💌</span>
                    <div>
                      <h3 className="font-bold text-amber-300 font-pop text-sm flex items-center gap-1.5">
                        御礼メッセージを返す
                        <span className="text-[10px] font-normal bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30">
                          {periodLabel}
                        </span>
                      </h3>
                      <p className="text-[11px] text-slate-400">褒めてくれた仲間に1回だけ感謝を届ける（1往復完結）</p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setReplyingLetter(null);
                      setSelectedReplyTemplate(null);
                    }}
                    className="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* 返信先プレビュー */}
                <div className="bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">{replyingLetter.avatar}</span>
                    <span className="font-bold text-slate-200">{replyingLetter.fromReal} さんへ</span>
                    <span className="text-[10px] text-slate-400">({replyingLetter.fromFake})</span>
                  </div>
                  <p className="text-[11px] text-slate-400 pl-7 truncate">
                    もらった感想: 「{replyingLetter.text}」
                  </p>
                </div>

                {/* 御礼定型5種選択リスト */}
                <div className="space-y-2">
                  <span className="text-[11px] text-slate-300 font-bold block">
                    御礼メッセージを1つ選んでください（1通につき1回のみ）：
                  </span>
                  <div className="space-y-1.5">
                    {currentReplyTemplates.map(tmpl => {
                      const isSelected = selectedReplyTemplate?.id === tmpl.id;
                      return (
                        <button
                          key={tmpl.id}
                          type="button"
                          onClick={() => setSelectedReplyTemplate(tmpl)}
                          className={`w-full text-left p-3 rounded-2xl border transition text-xs flex items-center justify-between ${
                            isSelected
                              ? 'bg-amber-600/30 border-amber-400 text-white shadow-md'
                              : 'bg-slate-950/80 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex-1 pr-2">
                            {tmpl.isExpert && (
                              <span className="inline-block bg-purple-500/20 text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-purple-500/30 mb-1">
                                😈 ちょいとがり玄人
                              </span>
                            )}
                            <p className="font-kiwi leading-relaxed">{tmpl.text}</p>
                          </div>
                          <span className={`w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                            isSelected ? 'border-amber-400 bg-amber-500 text-slate-950 text-[10px] font-bold' : 'border-slate-600'
                          }`}>
                            {isSelected ? '✓' : ''}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="flex items-center gap-2 pt-1">
                  <button
                    onClick={() => {
                      setReplyingLetter(null);
                      setSelectedReplyTemplate(null);
                    }}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleSendReply}
                    disabled={!selectedReplyTemplate}
                    className={`flex-1 font-bold py-2 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-1.5 ${
                      selectedReplyTemplate
                        ? 'bg-gradient-to-r from-amber-500 to-amber-600 hover:brightness-110 active:scale-95 text-slate-950'
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }`}
                  >
                    <span>💌</span>
                    <span>御礼を届ける！（1回完結）</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
