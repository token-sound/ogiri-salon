  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .font-pop {
      font-family: 'Mochiy Pop One', 'Zen Maru Gothic', sans-serif;
    }

    .font-kiwi {
      font-family: 'Kiwi Maru', serif;
    }

    /* 3Dカード反転アニメーション（正体アンヴェイル用） */
    .flip-card {
      perspective: 1000px;
    }
    .flip-card-inner {
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* 心臓鼓動パルス */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
      70% { transform: scale(1); }
    }
    .animate-heartbeat {
      animation: heartbeat 1.2s infinite;
    }

    /* 和風封筒開封アニメーション */
    @keyframes seal-open {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(-45deg); opacity: 0; }
    }
    .animate-seal-open {
      animation: seal-open 0.6s forwards;
    }

    /* 金枠の輝き */
    .gold-glow {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
      border-color: #f59e0b;
    }
  </style>
