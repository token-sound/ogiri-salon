<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Japanese Indigo / Night Violet) -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#261b4d"/>
      <stop offset="55%" stop-color="#140d2b"/>
      <stop offset="100%" stop-color="#080414"/>
    </radialGradient>

    <!-- Golden Stage Spotlight -->
    <radialGradient id="stageGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Chestnut Shell Gradient (Rich, Polished Marron) -->
    <linearGradient id="chestnutShell" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="22%" stop-color="#853205"/>
      <stop offset="65%" stop-color="#5a1e02"/>
      <stop offset="100%" stop-color="#340e00"/>
    </linearGradient>

    <!-- Chestnut Shell Elegant Light Reflection -->
    <linearGradient id="shellHighlight" x1="0%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>

    <!-- Chestnut Bottom (Pedicel / 栗の座) -->
    <linearGradient id="chestnutBase" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="30%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Zabuton Cushion Gradient (Kyoto Royal Purple) -->
    <linearGradient id="zabutonTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="40%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="zabutonRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- Sensu Golden Fan Gradient -->
    <linearGradient id="sensuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffbeb"/>
      <stop offset="80%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Gold Frame Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowZabuton" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadowChestnut" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="shadowSensu" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Japanese Traditional Pattern (Shippo Rings) -->
  <g opacity="0.09" stroke="#fef08a" stroke-width="1.6" fill="none">
    <circle cx="256" cy="235" r="210"/>
    <circle cx="256" cy="235" r="170" stroke-dasharray="8 6"/>
    <circle cx="256" cy="235" r="130"/>
  </g>

  <!-- Stage Glow behind Mascot -->
  <circle cx="256" cy="225" r="165" fill="url(#stageGlow)"/>

  <!-- Festive Golden Confetti & Flakes (大喜利の祝祭感) -->
  <g fill="#fbbf24">
    <path d="M115 110 C123 100 133 105 130 115 C127 125 117 120 115 110 Z" opacity="0.65"/>
    <path d="M395 105 C405 100 412 107 408 117 C402 125 395 115 395 105 Z" opacity="0.7"/>
    <path d="M420 190 C428 185 433 192 429 200 C423 206 417 198 420 190 Z" opacity="0.5"/>
    <path d="M88 205 C95 200 100 207 97 213 C92 218 87 212 88 205 Z" opacity="0.5"/>
    <!-- Sparkling cross stars -->
    <path d="M140 85 Q140 94 131 94 Q140 94 140 103 Q140 94 149 94 Q140 94 140 85 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M370 70 Q370 78 362 78 Q370 78 370 86 Q370 78 378 78 Q370 78 370 70 Z" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- ==================== 1. SENSU (大喜利の和扇子 - 背後から広がる) ==================== -->
  <g filter="url(#shadowSensu)">
    <!-- Sensu positioned behind chestnut slightly to the left/upper -->
    <g transform="translate(180, 210) rotate(-22)">
      <!-- Fan Arc -->
      <path d="M0 0 L-95 -125 C-60 -150 10 -155 75 -125 L0 0 Z" fill="url(#sensuGold)" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Ribs -->
      <path d="M0 0 L-65 -138" stroke="#f59e0b" stroke-width="1.8" opacity="0.6"/>
      <path d="M0 0 L-25 -148" stroke="#f59e0b" stroke-width="1.8" opacity="0.6"/>
      <path d="M0 0 L15 -146" stroke="#f59e0b" stroke-width="1.8" opacity="0.6"/>
      <path d="M0 0 L48 -135" stroke="#f59e0b" stroke-width="1.8" opacity="0.6"/>
      <!-- Bamboo Outer Sticks -->
      <path d="M0 0 L-97 -123" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M0 0 L77 -123" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Red Sun / Laugh Crest on Fan -->
      <circle cx="-10" cy="-105" r="18" fill="#dc2626"/>
      <text x="-10" y="-98" font-family="'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">笑</text>
      <!-- Pivot (Kaname) -->
      <circle cx="0" cy="0" r="5" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
    </g>
  </g>

  <!-- ==================== 2. ZABUTON (高座の紫座布団) ==================== -->
  <!-- Lifted upwards to ensure bottom text is safely within the maskable safe zone -->
  <g filter="url(#shadowZabuton)">
    <!-- Bottom Rim (Depth) -->
    <path d="M96 324 C96 312 152 302 256 302 C360 302 416 312 416 324 L408 344 C408 356 356 368 256 368 C156 368 104 356 104 344 Z" fill="url(#zabutonRim)"/>

    <!-- Main Cushion Top (Plump Purple Surface) -->
    <path d="M102 320 C104 302 158 288 256 288 C354 288 408 302 410 320 C410 340 354 358 256 358 C158 358 102 340 102 320 Z" fill="url(#zabutonTop)"/>

    <!-- Cushion Creases -->
    <path d="M256 292 C224 308 180 318 122 322" stroke="#3b0764" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M256 292 C288 308 332 318 390 322" stroke="#3b0764" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M256 292 L256 354" stroke="#3b0764" stroke-width="2.5" opacity="0.5"/>

    <!-- Golden Piping Trim -->
    <path d="M116 322 C148 334 198 344 256 344 C314 344 364 334 396 322" stroke="url(#goldBorder)" stroke-width="2" fill="none" opacity="0.85"/>

    <!-- Golden Tassels (房) at Corners -->
    <!-- Left Tassel -->
    <g transform="translate(102, 322)">
      <circle cx="0" cy="0" r="5" fill="#fde047"/>
      <path d="M0 3 C-6 14 -14 24 -18 32 M0 3 C-3 15 -7 26 -8 34 M0 3 C1 15 0 27 2 34" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Right Tassel -->
    <g transform="translate(410, 322)">
      <circle cx="0" cy="0" r="5" fill="#fde047"/>
      <path d="M0 3 C6 14 14 24 18 32 M0 3 C3 15 7 26 8 34 M0 3 C-1 15 0 27 -2 34" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Center Tuft Knot -->
    <circle cx="256" cy="328" r="4" fill="#fde047"/>
    <path d="M253 331 L249 344 M256 332 L256 346 M259 331 L263 344" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ==================== 3. PURE CHESTNUT (NO FACE / 美しい栗の実) ==================== -->
  <g filter="url(#shadowChestnut)">
    <!-- Chestnut Shell Silhouette -->
    <!-- Top point at (256, 85), plump organic curves to sides, sitting squarely on cushion -->
    <path d="M256 82 
             C246 102 212 154 165 200 
             C134 230 132 260 142 284 
             C155 312 200 320 256 320 
             C312 320 357 312 370 284 
             C380 260 378 230 347 200 
             C300 154 266 102 256 82 Z" 
          fill="url(#chestnutShell)"/>

    <!-- Natural Glossy Specular Reflection (栗の美しい光沢・ハイライト) -->
    <path d="M252 94 
             C240 110 200 160 170 204 
             C156 224 152 244 158 260 
             C150 240 154 220 171 196 
             C202 152 240 108 252 94 Z" 
          fill="url(#shellHighlight)"/>

    <!-- Secondary Soft Oval Sheen -->
    <ellipse cx="220" cy="155" rx="14" ry="24" transform="rotate(-30 220 155)" fill="#ffffff" opacity="0.30"/>
    <circle cx="206" cy="134" r="5" fill="#ffffff" opacity="0.45"/>

    <!-- Chestnut Pedicel / Base (栗の座 - クリーム色の下部) -->
    <path d="M142 284 
             C146 276 160 270 182 266 
             C212 262 238 266 256 268 
             C274 266 300 262 330 266 
             C352 270 366 276 370 284 
             C357 312 312 320 256 320 
             C200 320 155 312 142 284 Z" 
          fill="url(#chestnutBase)"/>

    <!-- Subtle Natural Texture Dots on Pedicel -->
    <g fill="#92400e" opacity="0.30">
      <circle cx="170" cy="288" r="2"/><circle cx="188" cy="295" r="2.2"/><circle cx="208" cy="290" r="2"/>
      <circle cx="228" cy="296" r="2.2"/><circle cx="246" cy="291" r="2"/><circle cx="256" cy="298" r="2.2"/>
      <circle cx="266" cy="291" r="2"/><circle cx="284" cy="296" r="2.2"/><circle cx="304" cy="290" r="2"/>
      <circle cx="324" cy="295" r="2.2"/><circle cx="342" cy="288" r="2"/>
      <circle cx="184" cy="304" r="2"/><circle cx="218" cy="308" r="2.2"/><circle cx="256" cy="311" r="2.2"/>
      <circle cx="294" cy="308" r="2.2"/><circle cx="328" cy="304" r="2"/>
    </g>

    <!-- Chestnut Tip Whimsical Sprout (てっぺんのツンとした突起) -->
    <path d="M256 82 C252 70 250 60 255 54 C257 50 261 52 259 60 C258 68 257 76 256 82 Z" fill="#92400e"/>
    <circle cx="255" cy="54" r="2" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- ==================== 4. BOLD "大喜利" TITLE BADGE (SAFE ZONE) ==================== -->
  <!-- Positioned firmly in safe zone: y=335 to y=415 (well above the bottom edge 512) -->
  <g filter="url(#shadowBadge)">
    <!-- Outer Gold Frame (Rounded Plaque) -->
    <rect x="126" y="336" width="260" height="80" rx="18" fill="url(#goldBorder)"/>

    <!-- Inner Red Lacquer (Shu-nuri / 朱塗り) Base -->
    <rect x="131" y="341" width="250" height="70" rx="14" fill="#881337"/>
    <rect x="134" y="344" width="244" height="64" rx="12" fill="#991b1b"/>
    <rect x="136" y="346" width="240" height="60" rx="10" fill="#b91c1c" stroke="#fef08a" stroke-width="1.8" stroke-opacity="0.85"/>

    <!-- Gold Rivets on Corners -->
    <g fill="#fef08a">
      <circle cx="146" cy="356" r="3"/>
      <circle cx="366" cy="356" r="3"/>
      <circle cx="146" cy="396" r="3"/>
      <circle cx="366" cy="396" r="3"/>
    </g>

    <!-- Bold, High-Impact "大 喜 利" Kanji -->
    <!-- Heavy Dark Shadow Outline for Max Contrast & Legibility -->
    <text x="256" y="392" 
          font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'HGSGyoshotai', serif" 
          font-weight="900" 
          font-size="46" 
          letter-spacing="6" 
          fill="#450a0a" 
          stroke="#450a0a" 
          stroke-width="8" 
          stroke-linejoin="round"
          text-anchor="middle">大喜利</text>

    <!-- Radiant Gold Main Kanji -->
    <text x="256" y="392" 
          font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'HGSGyoshotai', serif" 
          font-weight="900" 
          font-size="46" 
          letter-spacing="6" 
          fill="url(#goldPlate)" 
          text-anchor="middle">大喜利</text>
  </g>
</svg>