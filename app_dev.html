    /* 3Dカード反転アニメーション（正体アンヴェイル用） */
    .flip-card {
      perspective: 1000px;
    }
    .flip-card-inner {
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* 心臓鼓動パルス */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.08); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
      70% { transform: scale(1); }
    }
    .animate-heartbeat {
      animation: heartbeat 1.2s infinite;
    }

    /* 和風封筒開封アニメーション */
    @keyframes seal-open {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(-45deg); opacity: 0; }
    }
    .animate-seal-open {
      animation: seal-open 0.6s forwards;
    }

    /* 金枠の輝き */

    // --- セキュリティガード：ドメインロック ---

        'localhost',
        '127.0.0.1'

            </div>
          </div>
        `;
        throw new Error('Unauthorized domain execution blocked.');
      }
    })();

    // --- セキュリティガード：ソース盗用防止（右クリック・F12ガード） ---
    (function preventSourceTheft() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
        ) {
          e.preventDefault();
          return false;
        }
      });
    })();

    const { useState, useEffect, useRef, useMemo } = React;

    // --- 効果音システム (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      // 封筒開封 (シャキーン)
      playOpen() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      // 送信完了 (和太鼓ドン)
      playSubmit() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
      // よいしょ！ (ピコーン拍手風)
      playYoisho() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      // カウントダウン警告音 (コツコツ)
      playTick(isDanger = false) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isDanger ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(isDanger ? 880 : 520, now);
        gain.gain.setValueAtTime(isDanger ? 0.25 : 0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
      // 正体発表ドラムロール＆ファンファーレ
      playReveal() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.35, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.5);
        });
      }
    }
    const sound = new SoundFX();

    // 仮面アバターリスト

    // 今日のデフォルト5問（サロン主キャラ＆風刺 特製神回）

    // 上位リワード初期データ
    const INITIAL_TOP3_PROMOS = {

    function App() {
      // ユーザープロフィール
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_profile');
        return saved ? JSON.parse(saved) : {
          realName: 'サロンの仲間A',
          fakeName: '覆面の刺客',
          avatar: '🦊',
          isRegistered: false
        };
      });

      // 表示タブ: 'today' (今日の5問), 'answers' (みんなのボケ＆よいしょ), 'ranking' (月間集計＆アンヴェイル)
      const [tab, setTab] = useState('today');

      // 封筒開封＆タイマー状態
      // openedIndex: 現在開封してプレイ中の問題 (0..4, nullならなし)
      // answeredQuestions: 既に回答を送信した問題のインデックスセット [0, 1, ...]
      const [openedIndex, setOpenedIndex] = useState(null);
      const [answeredIndices, setAnsweredIndices] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_answered');
        return saved ? JSON.parse(saved) : [];
      });

      // 1問あたりの制限時間（1分50秒 = 110秒）
      const TIME_LIMIT = 110;
      const [timeLeft, setTimeLeft] = useState(TIME_LIMIT);
      const [currentInput, setCurrentInput] = useState('');

      // 回答リスト＆投票
      const [answers, setAnswers] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_answers');
        return saved ? JSON.parse(saved) : INITIAL_ANSWERS;
      });

      // 1ヶ月後の正体アンヴェイル（正体明かし）モードフラグ
      const [isUnveiled, setIsUnveiled] = useState(() => {
        return localStorage.getItem('ogiri_salon_unveiled') === 'true';
      });

      // ベスト3宣伝枠データ
      const [top3Promos, setTop3Promos] = useState(() => {
        const saved = localStorage.getItem('ogiri_salon_promos');
        return saved ? JSON.parse(saved) : INITIAL_TOP3_PROMOS;
      });

      // 宣伝編集モーダル
      const [editingRank, setEditingRank] = useState(null);
      const [editPromoForm, setEditPromoForm] = useState({ title: '', hobby: '', intro: '', link: '' });

      // 設定・プロフィール変更モーダル
      const [showProfileModal, setShowProfileModal] = useState(false);

      // サロン遊び方ルールブックモーダル
      const [showGuideModal, setShowGuideModal] = useState(false);

      // PWAインストール案内モーダル
      const [showInstallModal, setShowInstallModal] = useState(false);
      const [installPrompt, setInstallPrompt] = useState(null);

      // 月間カレンダー展開フラグ (A+D融合)
      const [showCalendar, setShowCalendar] = useState(false);

      // カレンダー日程計算（当月連動）
      const calendarInfo = useMemo(() => {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const today = now.getDate();
        const totalDays = new Date(year, month, 0).getDate();
        const daysLeft = Math.max(0, totalDays - today);
        const progressPercent = Math.min(100, Math.round((today / totalDays) * 100));

        const days = [];
        for (let d = 1; d <= totalDays; d++) {
          let status = 'future';
          if (d < today) status = 'past';
          else if (d === today) status = 'today';
          days.push({ day: d, status, isFinal: d === totalDays });
        }

        return { year, month, today, totalDays, daysLeft, progressPercent, days };
      }, []);

      // PWA インストールプロンプト監視
      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const handleInstallClick = () => {
        if (installPrompt) {
          installPrompt.prompt();
          installPrompt.userChoice.then(() => {
            setInstallPrompt(null);
          });
        } else {
          setShowInstallModal(true);
        }
      };

      // タイマー用Ref
      const timerRef = useRef(null);

      // 初回未登録ならプロフィール設定を開く
      useEffect(() => {
        if (!profile.isRegistered) {
          setShowProfileModal(true);
        }
      }, []);

      // Lucide アイコン初期化
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // タイマー処理 (110秒カウントダウン)
      useEffect(() => {
        if (openedIndex !== null && timeLeft > 0) {
          timerRef.current = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                handleTimeUp();
                return 0;
              }
              // カウントダウン警告音（残り30秒以下で5秒ごと、残り10秒以下で毎秒）
              if (prev <= 10) {
                sound.playTick(true);
              } else if (prev <= 30 && prev % 5 === 0) {
                sound.playTick(false);
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [openedIndex, timeLeft]);

      // 封筒を開封するアクション
      const handleOpenEnvelope = (index) => {
        if (answeredIndices.includes(index)) return; // 既に回答済み
        if (openedIndex !== null) return; // 既に他の問題を開いている

        sound.playOpen();
        setOpenedIndex(index);
        setTimeLeft(TIME_LIMIT);
        setCurrentInput('');
      };

      // 回答を送信する
      const handleSubmitAnswer = () => {
        if (openedIndex === null) return;
        const text = currentInput.trim();
        if (!text) {
          alert('ボケを入力してください！');
          return;
        }

        sound.playSubmit();
        const currentTopic = TODAY_TOPICS[openedIndex];

        // 新しい回答を作成
        const newAnswer = {
          id: 'ans_' + Date.now(),
          topicId: currentTopic.id,
          fakeName: profile.fakeName || '覆面の刺客',
          avatar: profile.avatar || '🦊',
          realName: profile.realName || 'サロンの仲間',
          text: text,
          points: 1, // 自分自身からの初期1P
          voters: ['user_self']
        };

        const updatedAnswers = [newAnswer, ...answers];
        setAnswers(updatedAnswers);
        localStorage.setItem('ogiri_salon_answers', JSON.stringify(updatedAnswers));

        // 回答済みインデックスを更新
        const newAnswered = [...answeredIndices, openedIndex];
        setAnsweredIndices(newAnswered);
        localStorage.setItem('ogiri_salon_answered', JSON.stringify(newAnswered));

        // 紙吹雪
        if (window.confetti) {
          window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
        }

        // 開封状態を終了
        setOpenedIndex(null);
        setCurrentInput('');
      };

      // 時間切れ時の自動提出処理
      const handleTimeUp = () => {
        sound.playTick(true);
        if (currentInput.trim()) {
          handleSubmitAnswer();
        } else {
          alert('⏰ 1分50秒が経過しました！残念ながらタイムアップ（パス）です。次の問題に挑戦しましょう！');
          if (openedIndex !== null) {
            const newAnswered = [...answeredIndices, openedIndex];

                      <li>画面下部の <span className="text-indigo-400 font-bold">「共有ボタン（四角から上矢印 ⎋）」</span> をタップ</li>
                      <li>メニューを少し下にスクロール</li>
                      <li><span className="text-amber-300 font-bold">「ホーム画面に追加（＋）」</span> をタップ</li>
                      <li>右上の「追加」を押せば完了！</li>
                    </ol>
                  </div>

                  {/* Android (Chrome) の手順 */}
                  <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3.5 space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🤖</span>
                      <h5 className="font-bold text-slate-100 text-xs">Android (Chrome) の場合</h5>
                    </div>
                    <ol className="list-decimal pl-5 space-y-1 text-slate-400 text-[11px]">
                      <li>画面右上の <span className="text-indigo-400 font-bold">「︙（メニュー）」</span> をタップ</li>
                      <li><span className="text-amber-300 font-bold">「アプリをインストール」</span> または <span className="text-amber-300 font-bold">「ホーム画面に追加」</span> をタップ</li>
                      <li>確認画面で「インストール」を押せば完了！</li>
                    </ol>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowInstallModal(false)}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
